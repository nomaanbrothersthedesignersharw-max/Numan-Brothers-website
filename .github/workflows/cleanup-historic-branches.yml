name: One-time cleanup of merged historical branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup-merged-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merged PRs and delete exact obsolete branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS='|' read -r branch expected_head pr_number; do
            [[ -n "$branch" ]] || continue

            echo "Checking merged PR #$pr_number for $branch"
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            pr_base="$(jq -r '.base.ref' <<<"$pr_json")"
            pr_head="$(jq -r '.head.ref' <<<"$pr_json")"
            pr_merged="$(jq -r '.merged' <<<"$pr_json")"
            pr_merged_at="$(jq -r '.merged_at // empty' <<<"$pr_json")"

            if [[ "$pr_base" != "main" || "$pr_head" != "$branch" || "$pr_merged" != "true" || -z "$pr_merged_at" ]]; then
              echo "::error::PR #$pr_number does not confirm a merge of $branch into main; refusing to delete."
              exit 1
            fi

            encoded_branch="${branch//\//%2F}"
            current_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" --jq '.commit.sha')"
            if [[ "$current_head" != "$expected_head" ]]; then
              echo "::error::Branch $branch changed since verification; refusing to delete."
              exit 1
            fi

            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "Deleted verified merged branch: $branch"
          done <<'BRANCHES'
          audit/fix-csv-and-release-checks-2026-11-09|dd4ef2f7cef75dbd76400db228c6bda45b9ff514|2
          dependabot/bun/motion-14.10.1|33f498f0504db8249b897594fef35f0f0b6c1f34|8
          dependabot/bun/tailwindcss/vite-4.3.5|752558b97a58ebf82a9d30d60d16e6332bb87bce|5
          dependabot/github_actions/actions/checkout-7|77bb901e76213231e28432cddac103803d9612b1|4
          dependabot/github_actions/actions/upload-artifact-7|ef0322114dc3256a4b98c628dd4bcb37ad21b207|3
          feature/cms-media-drafts-optimization|2dedd95350bca044d8a0d6870c743c662f8bf611|10
          vercel/install-vercel-web-analytics-z50gs9|e5da565f2a5200bb31c89e9556aaa9716aea0785|1
          BRANCHES
